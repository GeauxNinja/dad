<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Dads Slideshow</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #001a33;
      width: 100%;
      height: 100%;
      overflow: hidden;
      cursor: none;
    }

    .slideshow-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      background:
        radial-gradient(circle at center, rgba(0, 102, 204, 0.35), transparent 55%),
        linear-gradient(135deg, #001a33, #003b73, #001f3f);
      overflow: hidden;
    }

    .slideshow-container::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 20% 30%, rgba(0, 174, 255, 0.18), transparent 25%),
        radial-gradient(circle at 80% 70%, rgba(0, 102, 255, 0.18), transparent 25%);
      animation: blueGlow 10s ease-in-out infinite alternate;
      z-index: 0;
    }

    @keyframes blueGlow {
      from {
        opacity: 0.35;
        transform: scale(1);
      }
      to {
        opacity: 0.75;
        transform: scale(1.08);
      }
    }

    .slide {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: 0;
      transform: scale(1);
      transition:
        opacity 1.5s ease,
        transform 1.5s ease,
        filter 1.5s ease;
      z-index: 1;
      filter: drop-shadow(0 0 24px rgba(0, 140, 255, 0.45));
    }

    .slide.active {
      opacity: 1;
      z-index: 2;
    }

    .slide.previous {
      z-index: 1;
    }

    /* Fade */
    .transition-fade.active {
      opacity: 1;
    }

    /* Zoom In */
    .transition-zoom-in {
      transform: scale(1.15);
    }

    .transition-zoom-in.active {
      transform: scale(1);
      opacity: 1;
    }

    /* Zoom Out */
    .transition-zoom-out {
      transform: scale(0.9);
    }

    .transition-zoom-out.active {
      transform: scale(1);
      opacity: 1;
    }

    /* Slide Left */
    .transition-slide-left {
      transform: translateX(100%);
    }

    .transition-slide-left.active {
      transform: translateX(0);
      opacity: 1;
    }

    /* Slide Right */
    .transition-slide-right {
      transform: translateX(-100%);
    }

    .transition-slide-right.active {
      transform: translateX(0);
      opacity: 1;
    }

    /* Slide Up */
    .transition-slide-up {
      transform: translateY(100%);
    }

    .transition-slide-up.active {
      transform: translateY(0);
      opacity: 1;
    }

    /* Slide Down */
    .transition-slide-down {
      transform: translateY(-100%);
    }

    .transition-slide-down.active {
      transform: translateY(0);
      opacity: 1;
    }

    /* Soft Blur */
    .transition-blur {
      filter: blur(12px) drop-shadow(0 0 24px rgba(0, 140, 255, 0.45));
      transform: scale(1.05);
    }

    .transition-blur.active {
      filter: blur(0) drop-shadow(0 0 24px rgba(0, 140, 255, 0.45));
      transform: scale(1);
      opacity: 1;
    }

    /* Gentle Rotate */
    .transition-rotate {
      transform: rotate(-3deg) scale(1.08);
    }

    .transition-rotate.active {
      transform: rotate(0deg) scale(1);
      opacity: 1;
    }

    /* Blue overlay for a polished memorial-style look */
    .blue-vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      box-shadow: inset 0 0 120px rgba(0, 20, 60, 0.85);
      z-index: 4;
    }
  </style>
</head>

<body>

  <div class="slideshow-container">
    <img id="slideA" class="slide active" src="" alt="Slideshow image">
    <img id="slideB" class="slide" src="" alt="Slideshow image">
    <div class="blue-vignette"></div>
  </div>

  <script>
    /*
      Folder setup:

      slideshow/
      ├── index.html
      └── slides/
          ├── slide001.jpg
          ├── slide002.jpg
          ├── slide003.jpg
          └── slide127.jpg

      Change totalSlides to match your final number of images.
      Change fileExtension to "png" if using PNG files.
    */

    const totalSlides = 75;       // Change this to your total number of slides
    const fileExtension = "jpg";   // Use "jpg", "jpeg", or "png"

    const slideTime = 9000;        // 7000 = 7 seconds per slide
    const transitionSpeed = 2000;  // Matches the CSS transition time

    const slides = [];

    for (let i = 1; i <= totalSlides; i++) {
      const number = String(i).padStart(2, "0");
      slides.push(`slides/slide${number}.${fileExtension}`);
    }

    const transitions = [
      "transition-fade",
      "transition-zoom-in",
      "transition-zoom-out",
      "transition-slide-left",
      "transition-slide-right",
      "transition-slide-up",
      "transition-slide-down",
      "transition-blur",
      "transition-rotate"
    ];

    let currentIndex = 0;
    let showingA = true;
    let shuffledSlides = shuffleArray([...slides]);

    const slideA = document.getElementById("slideA");
    const slideB = document.getElementById("slideB");

    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const randomIndex = Math.floor(Math.random() * (i + 1));
        [array[i], array[randomIndex]] = [array[randomIndex], array[i]];
      }
      return array;
    }

    function getRandomTransition() {
      return transitions[Math.floor(Math.random() * transitions.length)];
    }

    function clearTransitionClasses(element) {
      transitions.forEach(transition => {
        element.classList.remove(transition);
      });
    }

    function showNextSlide() {
      currentIndex++;

      if (currentIndex >= shuffledSlides.length) {
        shuffledSlides = shuffleArray([...slides]);
        currentIndex = 0;
      }

      const currentSlide = showingA ? slideA : slideB;
      const nextSlide = showingA ? slideB : slideA;

      clearTransitionClasses(currentSlide);
      clearTransitionClasses(nextSlide);

      const transition = getRandomTransition();

      nextSlide.src = shuffledSlides[currentIndex];
      nextSlide.className = "slide " + transition;

      /*
        This forces the browser to apply the starting style
        before we add the active class.
      */
      void nextSlide.offsetWidth;

      currentSlide.classList.remove("active");
      currentSlide.classList.add("previous");

      nextSlide.classList.add("active");
      nextSlide.classList.remove("previous");

      showingA = !showingA;
    }

    function startSlideshow() {
      slideA.src = shuffledSlides[currentIndex];
      setInterval(showNextSlide, slideTime);
    }

    startSlideshow();
  </script>

</body>
</html>
